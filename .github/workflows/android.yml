name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APKs bauen
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: APK bereitstellen
        run: cp app/build/outputs/apk/release/app-release.apk piant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: piant-apk
          path: piant.apk

      - name: Release anlegen (bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" piant.apk --title "Piant $GITHUB_REF_NAME" --generate-notes

      # Jeder Stand auf main wird als Release veröffentlicht. Die aktuelle APK liegt damit immer unter
      # https://github.com/Hakenadu/piant/releases/latest/download/piant.apk
      - name: Release anlegen (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" piant.apk --target "$GITHUB_SHA" --title "Piant $TAG" --generate-notes --latest
